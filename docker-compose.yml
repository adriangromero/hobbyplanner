services: 
  php:
    container_name: hobbyplanner-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/srv/app
    working_dir: /srv/app
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
    networks:
      - backend

  vue:
    container_name: hobbyplanner-vue
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    depends_on:
      - php
    command: ["npm", "run", "dev"]
    networks:
      - backend

  nginx:
    container_name: hobbyplanner-nginx
    depends_on:
     - php
     - vue
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    volumes:
      - ./backend:/srv/app
      - ./frontend/dist:/usr/share/nginx/html
    ports:
      - "80:80"
    networks:
      - backend 

  db:
    image: mysql:8
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend   # <-- AÑADIDO

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - backend   # <-- AÑADIDO

volumes:
  node_modules:
  db_data:

networks:
  backend:
    driver: bridge
