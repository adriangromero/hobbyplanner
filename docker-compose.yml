# ──────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT ONLY — credentials here are NOT used in production.
# In production, inject secrets via environment variables or a vault.
# ──────────────────────────────────────────────────────────────

services:
  php:
    container_name: hobbyplanner-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/srv/app
    working_dir: /srv/app
    environment:
      APP_ENV: dev
    depends_on:
      - db
    networks:
      - backend

  vue:
    container_name: hobbyplanner-vue
    build:
      context: .
      dockerfile: docker/vue/Dockerfile
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - nginx
    command: ["sh", "-c", "npm install && npm run dev"]
    networks:
      - backend

  nginx:
    container_name: hobbyplanner-nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    depends_on:
      - php
    volumes:
      - ./backend:/srv/app
    ports:
      - "80:80"
    networks:
      - backend

  db:
    image: mysql:8
    container_name: hobbyplanner-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: hobbyplanner-phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - backend

volumes:
  node_modules:
  db_data:

networks:
  backend:
    driver: bridge
