security:
  password_hashers:
    App\Domain\Entity\User:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Domain\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    api:
      pattern: ^/api
      stateless: true
      jwt: ~

  access_control:
    - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
    - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: ROLE_USER }

when@test:
  security:
    password_hashers:
      App\Domain\Entity\User:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10