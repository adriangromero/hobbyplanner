security:
  password_hashers:
    App\Domain\Entity\User:
      algorithm: auto

  providers:
    app_user_provider:
      entity:
        class: App\Domain\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: app_user_provider
      security: false   # 🔥 TODA LA API ABIERTA

  access_control:
    - { path: ^/api, roles: PUBLIC_ACCESS }  # 🔥 TODA LA API ABIERTA

when@test:
  security:
    password_hashers:
      App\Domain\Entity\User:
        algorithm: auto
        cost: 4
        time_cost: 3
        memory_cost: 10
