parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Ports → Adapters
    App\Application\Port\CurrentUserProvider:
        class: App\Infrastructure\Security\SymfonyCurrentUserProvider

    App\Application\Port\PasswordHasherPort:
        class: App\Infrastructure\Security\SymfonyPasswordHasher

    App\Application\Port\TokenGeneratorPort:
        class: App\Infrastructure\Security\LexikTokenGenerator

    App\Application\Port\TransactionPort:
        class: App\Infrastructure\Persistence\Doctrine\DoctrineTransactionManager

    # Repositories
    App\Domain\Repository\UserRepositoryInterface:
        class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository

    App\Domain\Repository\WorkSessionRepositoryInterface:
        class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineWorkSessionRepository

    App\Domain\Repository\ItemRepositoryInterface:
        class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineItemRepository

    App\Domain\Repository\ProjectRepositoryInterface:
        class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineProjectRepository

    # Controllers
    App\Infrastructure\Controller\:
        resource: '../src/Infrastructure/Controller/'
        tags: ['controller.service_arguments']

    # Use Cases
    App\Application\UseCase\:
        resource: '../src/Application/UseCase/'
